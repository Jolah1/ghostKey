# fly.toml — ghostkey-lightning-lnbits sidecar deployment for Fly.io.
#
# Drop-in alternative to the Breez sidecar (`../ghostkey-lightning-breez/fly.toml`).
# Both implement the same wire protocol, so swapping which one is deployed
# is a matter of which fly.toml you `fly deploy` and which URL you set as
# GHOSTKEY_LN_SIDECAR_URL on the main `ghostkey` app.
#
# Provision once, then `fly deploy --config crates/ghostkey-lightning-lnbits/fly.toml`:
#
#   fly apps create ghostkey-lightning-lnbits
#   fly secrets set \
#     LNBITS_URL="https://lnbits.example.com" \
#     LNBITS_INVOICE_KEY="..." \
#     GHOSTKEY_LN_SIDECAR_SHARED_SECRET="$(openssl rand -hex 32)" \
#     -a ghostkey-lightning-lnbits
#
# Then wire the shared secret + URL pointer on the main `ghostkey` app:
#
#   fly secrets set \
#     GHOSTKEY_LN_SIDECAR_URL="http://ghostkey-lightning-lnbits.internal:8788" \
#     GHOSTKEY_LN_SIDECAR_SHARED_SECRET="<the same value as above>" \
#     -a ghostkey
#
# See DEPLOY.md → "Lightning sidecar (two-process deploy)" for the
# full step-by-step.
#
# NOTE: there is intentionally NO [mounts] section here, unlike the
# Breez sidecar's fly.toml. This sidecar holds no on-disk state — the
# LNbits instance owns the Lightning wallet, so this process is a
# pure stateless translator. Restarts are cheap.

app           = "ghostkey-lightning-lnbits"
primary_region = "ams"   # match the main `ghostkey` app's region

[build]
  dockerfile = "Dockerfile"

[env]
  # Bind to all interfaces inside the container so the 6PN private
  # network can reach us. The defence in depth is the shared bearer
  # secret enforced in src/main.rs; the sidecar refuses to start
  # without GHOSTKEY_LN_SIDECAR_SHARED_SECRET.
  GHOSTKEY_LN_LNBITS_BIND = "0.0.0.0:8788"

  # Upstream HTTP timeout to the LNbits instance. Default 15s leaves
  # generous headroom for the main server's 30s tick.
  LNBITS_TIMEOUT_SECS = "15"

  RUST_LOG = "ghostkey_lightning_lnbits=info,info"

# Internal-only services section. No [http_service] block: this app
# is reached exclusively from inside the Fly 6PN private network, and
# the bearer secret is the only authentication. Exposing this app
# publicly would weaken that posture significantly.
[[services]]
  protocol      = "tcp"
  internal_port = 8788
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # The sidecar comes up immediately and starts probing LNbits in a
  # background task; `/v1/health.ready` flips to true on the first
  # successful probe. The Fly health check below is a plain TCP
  # check, not an HTTP one, so it's tolerant of the brief boot window
  # where `ready` is still false.
  [[services.tcp_checks]]
    interval        = "30s"
    grace_period    = "30s"
    timeout         = "5s"

# Small machine. Stateless translator, no SDK overhead — the 256 MB
# default is plenty. Bump if you see OOM kills under sustained load.
[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory_mb = 256
