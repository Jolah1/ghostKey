[package]
name = "ghostkey-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Watch-only notifier + check-in tracker for the GhostKey inheritance protocol"

[[bin]]
name = "ghostkey-server"
path = "src/main.rs"

[dependencies]
ghostkey-core = { path = "../ghostkey-core" }
bitcoin = { workspace = true }
bdk_wallet = { workspace = true }
bdk_esplora = { workspace = true }
miniscript = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
ipnet = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
# Not used directly: a floor under the SQLite that sqlx bundles, so the
# lock file can't fall back below the fix for RUSTSEC-2026-0459 (#406).
libsqlite3-sys = ">=0.39"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
async-trait = "0.1"

# Crypto for at-rest heir contact encryption and claim tokens.
chacha20poly1305 = { workspace = true }
hkdf   = { workspace = true }
sha2   = { workspace = true }
hmac   = { workspace = true }
sha1   = { workspace = true }
form_urlencoded = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
rand   = { workspace = true }
hex    = { workspace = true }
bech32 = { workspace = true }
lettre = { workspace = true }

# Web push (RFC 8291/8292): P-256 ECDH + ES256 VAPID signing, and
# AES-128-GCM content encryption. Same RustCrypto family as the
# chacha20poly1305/hkdf deps above; see src/push.rs for why we
# implement the (small, test-vectored) protocol ourselves instead of
# pulling the legacy-hyper `web-push` crate.
p256    = { version = "0.14", features = ["ecdh", "ecdsa", "getrandom"] }
aes-gcm = "0.10"

[dev-dependencies]
# tower::ServiceExt::oneshot is the idiomatic way to drive an Axum
# Router with a Request<Body> in a unit test without binding a TCP
# port. The "util" feature flag is what exports the trait.
tower = { workspace = true, features = ["util"] }
