[package]
name = "ghostkey-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Watch-only notifier + check-in tracker for the GhostKey inheritance protocol"

[[bin]]
name = "ghostkey-server"
path = "src/main.rs"

[dependencies]
ghostkey-core = { path = "../ghostkey-core" }
bitcoin = { workspace = true }
bdk_wallet = { workspace = true }
bdk_esplora = { workspace = true }
miniscript = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
ipnet = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
async-trait = "0.1"

# Crypto for at-rest heir contact encryption and claim tokens.
chacha20poly1305 = { workspace = true }
hkdf   = { workspace = true }
sha2   = { workspace = true }
hmac   = { workspace = true }
sha1   = { workspace = true }
form_urlencoded = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
rand   = { workspace = true }
hex    = { workspace = true }
bech32 = { workspace = true }
lettre = { workspace = true }

# Web push (RFC 8291/8292): P-256 ECDH + ES256 VAPID signing, and
# AES-128-GCM content encryption. Same RustCrypto family as the
# chacha20poly1305/hkdf deps above; see src/push.rs for why we
# implement the (small, test-vectored) protocol ourselves instead of
# pulling the legacy-hyper `web-push` crate.
p256    = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"

# NOTE on Lightning support:
#
# The Breez SDK Liquid crate (breez-sdk-liquid) is the production
# backend for the LightningProvider trait in src/lightning.rs. It is
# NOT a direct dependency of this crate, because:
#
#   * It is only distributed via git (not crates.io).
#   * It pins reqwest =0.12.18 exactly, which conflicts with the
#     reqwest version every other workspace crate uses.
#   * It transitively forks esplora-client, lwk, rusqlite, rusqlite_migration,
#     sqlite-wasm-rs, and breez-sdk itself; pulling those into this
#     workspace would balloon the build matrix and tie our CI to
#     Breez's release cadence.
#
# Instead, Breez lives in the sibling crate `crates/ghostkey-lightning-breez`
# (excluded from the root workspace; see ../../Cargo.toml). That crate
# builds a small HTTP sidecar binary. This server talks to the sidecar
# over localhost via `HttpProvider` (src/lightning.rs); the wire
# protocol is the small JSON surface documented in the sidecar's
# README.md. Selection is env-driven: set GHOSTKEY_LN_BREEZ_URL and
# GHOSTKEY_LN_BREEZ_SHARED_SECRET to enable, leave them unset to fall
# back to NoopProvider (in which case `/lightning-checkin/*` returns
# 503 and the web UI hides the button).
#
# See DESIGN.md "Lightning check-ins" for the full rationale.

[dev-dependencies]
# tower::ServiceExt::oneshot is the idiomatic way to drive an Axum
# Router with a Request<Body> in a unit test without binding a TCP
# port. The "util" feature flag is what exports the trait.
tower = { workspace = true, features = ["util"] }
