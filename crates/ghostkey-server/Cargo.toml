[package]
name = "ghostkey-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Watch-only notifier + check-in tracker for the GhostKey inheritance protocol"

[[bin]]
name = "ghostkey-server"
path = "src/main.rs"

[dependencies]
ghostkey-core = { path = "../ghostkey-core" }
bitcoin = { workspace = true }
bdk_wallet = { workspace = true }
bdk_esplora = { workspace = true }
miniscript = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
async-trait = "0.1"

# Crypto for at-rest heir contact encryption and claim tokens.
chacha20poly1305 = { workspace = true }
hkdf   = { workspace = true }
sha2   = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
rand   = { workspace = true }
hex    = { workspace = true }
lettre = { workspace = true }

# NOTE on Lightning support:
#
# The Breez SDK Liquid crate (breez-sdk-liquid) is the intended
# backend for the LightningProvider trait in src/lightning.rs. We do
# NOT add it as a dependency here, even optionally, because:
#
#   * It is only distributed via git (not crates.io).
#   * It pins reqwest =0.12.18 exactly, which conflicts with the
#     reqwest version every other workspace crate uses.
#   * It transitively forks esplora-client, lwk, rusqlite, rusqlite_migration,
#     sqlite-wasm-rs, and breez-sdk itself; pulling those into this
#     workspace would balloon the build matrix and tie our CI to
#     Breez's release cadence.
#
# The plan to actually wire Breez is to add a sibling crate
# (`crates/ghostkey-lightning-breez`) that depends on breez-sdk-liquid
# *and* implements the LightningProvider trait defined in this crate.
# The server would discover that provider via a small dynamic shim
# (env-var-gated `extern fn`-style boundary, or a separate process
# behind a Unix socket). Until that crate exists the LightningProvider
# is the NoopProvider and the /lightning-checkin routes return 503.
#
# See DESIGN.md "Lightning check-ins" for the full rationale.

[dev-dependencies]
# tower::ServiceExt::oneshot is the idiomatic way to drive an Axum
# Router with a Request<Body> in a unit test without binding a TCP
# port. The "util" feature flag is what exports the trait.
tower = { workspace = true, features = ["util"] }
