# cargo-audit configuration.
#
# Every entry below is an explicit decision NOT to fix an advisory, with
# the reasoning. We don't blanket-ignore: each `id` carries a per-CVE
# justification + a "what would it take to actually fix this" note so a
# future maintainer can revisit the decision when upstream catches up.
#
# Scope:
#   This file is read by `cargo audit` (both locally and in CI). The CI
#   workflow installs `cargo-audit` and invokes the same CLI we use
#   locally, so adding an `id` here is the single source of truth.

[advisories]
ignore = [
  # RUSTSEC-2023-0071: Marvin attack — timing sidechannel in RSA key recovery.
  #
  # Why this doesn't apply to GhostKey:
  #   GhostKey uses no RSA anywhere. All on-chain crypto is secp256k1
  #   Taproot; all server-side authenticated-encryption is
  #   XChaCha20-Poly1305 with HKDF-SHA256 + Argon2id. The `rsa` crate
  #   is pulled in transitively by sqlx-mysql features that we never
  #   instantiate (we use SQLite). The vulnerable code path is therefore
  #   unreachable at runtime.
  # Status:
  #   No upstream fix exists in the rsa crate as of this writing.
  # Revisit when:
  #   `rsa` ships a constant-time fix, OR sqlx publishes a version that
  #   drops the rsa dependency from its sqlite feature tree.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2026-0098: rustls-webpki accepted name constraints for URI names.
  # RUSTSEC-2026-0099: rustls-webpki accepted wildcard name constraints.
  # RUSTSEC-2026-0104: rustls-webpki panics on malformed certificate revocation list.
  #
  # Why we can't currently fix these:
  #   All three reach us through:
  #     ghostkey-{server,cli}
  #       └── bdk_esplora 0.20  ← pinned by us
  #             └── esplora-client 0.11
  #                   └── minreq 2.14
  #                         └── rustls 0.21
  #                               └── rustls-webpki 0.101 (vulnerable)
  #   minreq 2.x only accepts rustls 0.21.x; rustls 0.21 only accepts
  #   rustls-webpki 0.101.x. To pull in the fixed >=0.103.13 we would
  #   need to bump esplora-client past 0.11, which requires bumping
  #   bdk_esplora past 0.20, which is a semver-incompatible BDK bump
  #   (0.22 is the next available version) and would force a
  #   significant API migration we have not yet planned.
  #
  # Why the impact in our case is low:
  #   The vulnerable code path is TLS certificate validation in minreq.
  #   ghostkey-server uses minreq only to talk to Esplora at a URL the
  #   operator configures (default https://blockstream.info/api on
  #   mainnet, https://blockstream.info/testnet/api on testnet). All
  #   three CVEs require a malicious server certificate path that the
  #   operator would have to explicitly point us at. We are not
  #   accepting arbitrary URLs from users; the URL is operator-set at
  #   startup. The ghostkey-cli reaches the same code via the user's
  #   own bitcoind RPC endpoint, which they likewise control.
  # Status:
  #   Tracked. An earlier version of this note said the fix was to
  #   migrate to bdk_esplora 0.22+. That was tested on 2026-10-26 and
  #   is wrong: bdk_esplora 0.22.3 resolves esplora-client to 0.12.3,
  #   which still depends on minreq 2.14 and so still pulls rustls
  #   0.21. It also adds a second bdk_core (0.6.4 beside the 0.4.1 that
  #   bdk_wallet 1.0.0 pins), which is its own hazard.
  #
  #   The real fix is esplora-client 0.13+, which replaced minreq with
  #   `bitreq`. No bdk_esplora release depends on it yet. And it is not
  #   sufficient on its own: bitcoincore-rpc 0.19 -> jsonrpc 0.18 pulls
  #   minreq independently, so both legs have to move before rustls
  #   0.21 leaves the tree.
  # Revisit when:
  #   A bdk_esplora release depends on esplora-client 0.13+ (dropping
  #   minreq for bitreq), AND bitcoincore-rpc no longer reaches minreq
  #   through jsonrpc.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",

  # RUSTSEC-2026-0381: webpki-roots bundled roots trust distrusted emSign intermediates.
  # RUSTSEC-2026-0382: rustls-webpki may accept distrusted intermediates.
  #
  # Why we can't currently fix these:
  #   Same minreq chain as the three advisories above, and stuck for
  #   the same reason. The fixed versions (webpki-roots >=1.0.10,
  #   rustls-webpki >=0.103.16) are both in the tree already and are
  #   what rustls 0.23 uses. Only the copies underneath rustls 0.21
  #   (webpki-roots 0.25.4, rustls-webpki 0.101.7) are flagged, and
  #   rustls 0.21 accepts neither fixed version.
  # Why the impact in our case is low:
  #   Both are about trusting a certificate path we should have
  #   rejected. The affected client is minreq, which we point only at
  #   an Esplora URL the operator sets at startup (and, in the CLI, the
  #   user's own bitcoind RPC endpoint). An attacker needs a
  #   certificate from a distrusted emSign intermediate for that exact
  #   host, and the data at risk is public blockchain data we read, not
  #   anything we send. No key material or vault secret crosses this
  #   client.
  # Status:
  #   Same fix and same blocker as RUSTSEC-2026-0098/0099/0104 above.
  # Revisit when:
  #   See the "Revisit when" immediately above; one change clears all five.
  "RUSTSEC-2026-0381",
  "RUSTSEC-2026-0382",

  # RUSTSEC-2026-0346: rustls `Debug` impls for client session values expose TLS secrets.
  # RUSTSEC-2026-0349: rustls unauthenticated ServerHello can downgrade later
  #                    connections to classical key exchange.
  #
  # Scope of this entry:
  #   Both advisories cover rustls 0.21 and 0.23. The 0.23 copy is
  #   FIXED in the tree (we are on 0.23.46). Only the 0.21.12 copy
  #   under minreq is accepted here, for the same reason as every
  #   other entry on that chain: rustls 0.21 will never receive a fix,
  #   since the patched version is 0.23.46. Note cargo-audit ignores by
  #   advisory ID and not per version, so these two lines also cover
  #   the 0.23 copy we have already patched. Lockfile versions only
  #   move forward, so that is acceptable.
  # Why the impact in our case is low:
  #   0346 only leaks secrets if something prints rustls client session
  #   values with `Debug`. Neither we nor minreq does.
  #   0349 is a downgrade away from post-quantum key exchange. rustls
  #   0.21 never offered post-quantum key exchange, so on that copy
  #   there is nothing to downgrade from.
  # Revisit when:
  #   Same condition as RUSTSEC-2026-0098/0099/0104 above.
  "RUSTSEC-2026-0346",
  "RUSTSEC-2026-0349",

  # RUSTSEC-2026-0387: crypto-bigint timing variability in operations
  # intended to be constant-time.
  #
  # Why we can't fix this in a lockfile bump:
  #   It reaches us through a direct dependency we chose:
  #     ghostkey-server
  #       └── p256 0.13          ← ours
  #             └── elliptic-curve 0.13.8
  #                   └── crypto-bigint 0.5.5 (vulnerable)
  #   The advisory wants >=0.7.6. `p256 = "0.14"` does resolve
  #   crypto-bigint to 0.7.10 (verified 2026-10-26), but it is not a
  #   drop-in: it moves to rand_core 0.10, so `ThreadRng` no longer
  #   satisfies `CryptoRng` at push.rs:346, and `to_encoded_point` is
  #   gone from `PublicKey` at push.rs:129 and push.rs:449.
  # Why the impact in our case is low:
  #   p256 is the Web Push crypto in `push.rs`: ECDSA to sign the VAPID
  #   JWT, ECDH to encrypt the payload. A timing sidechannel needs
  #   precise, repeated measurement of those operations, and the VAPID
  #   key signs when the notifier decides to send rather than when a
  #   caller asks, so there is no way to drive it on demand. The worst
  #   case is disclosure of the VAPID signing key, which would let
  #   someone send push notifications to subscribers. It is not a
  #   Bitcoin key: it cannot move funds or affect a claim.
  # Status:
  #   Tracked in issue #380, with the three compile errors written out.
  #   Deliberately not bundled into a dependency bump, because item one
  #   is about where key-generation randomness comes from and getting
  #   that wrong would be worse than the advisory.
  # Revisit when:
  #   #380 lands, or p256 publishes a 0.13.x that takes crypto-bigint
  #   >=0.7.6.
  "RUSTSEC-2026-0387",
]
