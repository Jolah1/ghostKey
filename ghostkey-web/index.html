<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Modern browsers prefer the SVG; older clients pick favicon.ico.
         apple-touch-icon is what iOS draws on the Home Screen when the
         user installs the PWA via Safari's Share menu. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- viewport-fit=cover lets the dashboard render under iOS's safe
         areas (status bar, home-indicator) when launched standalone,
         instead of being letterboxed. CSS env(safe-area-inset-*) on
         the chrome handles the actual layout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10151B" />
    <!-- iOS-specific PWA hints. `apple-mobile-web-app-capable=yes`
         tells Safari to launch in standalone (no browser chrome) when
         the user opens from the Home Screen. The status-bar style
         picks the bar tint to harmonize with our dark theme. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GhostKey" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Non-custodial Bitcoin inheritance. Set up once, tap once a month to say you're here. If you ever stop, the people you chose can claim what's theirs — no lawyers, no custodian."
    />
    <title>GhostKey — Non-custodial Bitcoin inheritance</title>
    <link rel="canonical" href="https://www.ghostkeyapp.com/" />

    <!-- Open Graph: how the link previews on Facebook, LinkedIn,
         WhatsApp, Telegram, Nostr, etc. Absolute URLs so scrapers that
         don't resolve relative paths still find the image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GhostKey" />
    <meta property="og:title" content="GhostKey — Non-custodial Bitcoin inheritance" />
    <meta
      property="og:description"
      content="Set up once, tap once a month to say you're here. If you ever stop, the people you chose can claim what's theirs. No lawyers, no custodian."
    />
    <meta property="og:url" content="https://www.ghostkeyapp.com/" />
    <meta property="og:image" content="https://www.ghostkeyapp.com/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="GhostKey — don't let your Bitcoin die with you. Non-custodial Bitcoin inheritance."
    />

    <!-- Twitter / X card. Large image now that we ship a 1200x630 banner. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ghostKeybtc" />
    <meta name="twitter:title" content="GhostKey — Non-custodial Bitcoin inheritance" />
    <meta
      name="twitter:description"
      content="Set up once, tap once a month. If you ever stop, the people you chose can claim what's theirs. No lawyers, no custodian."
    />
    <meta name="twitter:image" content="https://www.ghostkeyapp.com/og-banner.png" />
    <!-- Fonts are self-hosted (@fontsource-variable, imported in
         main.tsx) so the CSP needs no Google Fonts origins and the
         page loads with zero third-party requests. -->
    <!-- Theme is resolved before paint by an external (parser-blocking)
         script instead of an inline one, so the CSP can keep
         script-src down to 'self'. See public/theme-init.js. -->
    <script src="/theme-init.js"></script>
    <!-- Pre-mount placeholder so the first paint is never a blank
         page on slow connections. React replaces #root's children on
         mount. Colors are hardcoded mid-greys that read on both the
         dark and light theme backgrounds. -->
    <style>
      #gk-boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        color: #7e8894;
        /* Invisible for the first beat so a fast load never flashes it. */
        animation: gk-boot-in 0.3s ease 0.15s backwards;
      }
      #gk-boot .gk-boot-spin {
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid #7e8894;
        border-right-color: transparent;
        border-radius: 50%;
        animation: gk-boot-spin 0.8s linear infinite;
      }
      @keyframes gk-boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes gk-boot-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #gk-boot, #gk-boot .gk-boot-spin { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="gk-boot"><div class="gk-boot-spin" aria-hidden="true"></div>Getting things ready…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
