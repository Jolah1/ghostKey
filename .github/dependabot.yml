# Automated dependency + security update PRs.
# Grouped and weekly so review stays low-noise for a solo maintainer.
version: 2
updates:
  # Rust server (workspace root Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Web app
  - package-ecosystem: "npm"
    directory: "/ghostkey-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The GitHub Actions we pin in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
