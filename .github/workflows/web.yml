# Continuous integration for the web dashboard.
#
# Runs only when ghostkey-web/ is touched (so server-only PRs don't
# pay the npm install cost). Catches:
#   - TypeScript type errors,
#   - production build failures (Tailwind purge, Vite resolution, etc.).

name: web

on:
  push:
    branches: [main]
    paths:
      - "ghostkey-web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "ghostkey-web/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ghostkey-web

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ghostkey-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
