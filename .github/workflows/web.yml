# Continuous integration for the web dashboard.
#
# Runs only when ghostkey-web/ is touched (so server-only PRs don't
# pay the npm install cost). Catches:
#   - TypeScript type errors,
#   - production build failures (Tailwind purge, Vite resolution, etc.),
#   - accessibility regressions (axe over the four core pages, #225),
#   - performance/a11y budget regressions (Lighthouse, #225).

name: web

on:
  push:
    branches: [main]
    paths:
      - "ghostkey-web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "ghostkey-web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ghostkey-web

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ghostkey-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browser gates, both Playwright, both on the runner's system
      # Chrome (channel: "chrome" in playwright.config.ts) so there is no
      # ~150MB browser download:
      #
      #   - Accessibility (#225): axe scans landing, setup, dashboard and
      #     claim against the built bundle with a mocked API, and fails on
      #     any serious/critical violation.
      #   - The recovery kit's spend path: unlock, find coins, sign in
      #     wasm, broadcast, driving the real single-file kit HTML.
      #
      # `npm run e2e` runs every spec in e2e/, which is the whole point.
      # It used to be `npm run a11y`, so the kit spec ran nowhere: it sat
      # broken on main and the failure it hid was the page telling someone
      # their correct password was wrong. The kit is the only way to reach
      # the money without GhostKey, so its one browser-level test has to
      # be enforced, not merely present. Hermetic — the test mocks Esplora
      # itself, so no bitcoind and no network.
      - run: npm run e2e
      # Performance + accessibility budgets (#225): Lighthouse in mobile
      # emulation against the static build. Budgets live in
      # lighthouserc.json (perf >= 0.90 on landing and claim, a11y >=
      # 0.95). LHCI's console summary groups the two hash-routed URLs
      # under one path; every run is still collected and asserted.
      - run: npm run lhci
      - name: Package reproducible web release
        run: |
          set -euo pipefail
          mkdir -p release
          npm sbom --package-lock-only --sbom-format cyclonedx \
            > release/ghostkey-web-sbom.cdx.json
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C dist -cf - . \
            | gzip -n > "release/ghostkey-web-${GITHUB_SHA}.tar.gz"
          cd release
          sha256sum "ghostkey-web-${GITHUB_SHA}.tar.gz" \
            ghostkey-web-sbom.cdx.json > SHA256SUMS
      - name: Upload web release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostkey-web-${{ github.sha }}
          path: ghostkey-web/release/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: attest main web artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact artifact built by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghostkey-web-${{ github.sha }}
          path: release
      - name: Attest web bundle, checksum manifest and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
