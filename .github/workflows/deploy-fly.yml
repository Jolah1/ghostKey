# Auto-deploy the Rust server to Fly.io on every push to main.
#
# Why this exists:
#   Before this workflow, the live server at ghostkey.fly.dev only
#   updated when a maintainer remembered to run `fly deploy` from
#   their laptop. This led to weeks of drift between main and
#   production — at one point /vaults/from-xpub returned 405 because
#   the deployed binary predated the password-vault redesign. CI
#   passing meant "the code compiles", not "the code is live".
#
# What it does:
#   On every push to main that changes server-relevant files, build
#   the Docker image via Fly's remote builder and deploy it to the
#   `ghostkey` app. SQLite migrations run automatically at server
#   startup (sqlx::migrate!), so we don't need a separate migration
#   step.
#
# What it does NOT do:
#   - Deploy the web frontend. Vercel handles that on its own based
#     on the vercel.json at the repo root.
#   - Run tests. The rust.yml workflow already gates merges on tests
#     passing; if those didn't pass, the PR wouldn't be on main.
#   - Roll back on failure. Fly keeps the previous machine running
#     until the new one passes its health check (/health), so a
#     broken deploy doesn't take the site down — but it doesn't
#     automatically revert main either. Watch the action log.
#
# Required secret (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN  — created with
#                    `fly tokens create deploy --app ghostkey --expiry 8760h`
#                    (one-year token; rotate annually). NOT your
#                    personal Fly login token; use a deploy-scoped
#                    token so a leak is bounded to deploys of this
#                    one app.
#
#   We probe the token at the start of every run with
#   `flyctl auth whoami` so an expired or revoked token surfaces
#   with a clear error annotation rather than a silent 5-second
#   exit-1 from `flyctl deploy` itself.
#
# Manual override:
#   `fly deploy` from your laptop still works if you need to push
#   a hotfix without going through main. See DEPLOY.md.

name: deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/deploy-fly.yml"
  # Allow re-running manually from the Actions tab.
  workflow_dispatch:

# Don't pile up deploys; one at a time, latest wins.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin to a known-good flyctl. `@master` worked for the early
      # deploys but in 2026 any breaking-change release to the
      # action's master branch would silently take CI down with it.
      # Bump this when you've manually verified a newer version
      # against `fly deploy --remote-only` locally.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, pinned 2026-07-20
        with:
          version: 0.4.55
      # Surface auth failures with a real error message BEFORE the
      # deploy step runs. Without this, an expired or revoked
      # FLY_API_TOKEN produces a 5-second exit-1 from `flyctl deploy`
      # with no obvious cause in the GitHub Action log. The whoami
      # call prints `email=...` and the org list, both of which make
      # it obvious whether we're authenticated as the expected user
      # and have access to the `ghostkey` app.
      - name: Verify Fly auth
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::flyctl auth whoami"
          flyctl auth whoami || {
            echo "::error::FLY_API_TOKEN is missing, expired, or revoked."
            echo "::error::Generate a new one with: fly tokens create deploy --app ghostkey --expiry 8760h"
            echo "::error::Update the GitHub secret at https://github.com/Jolah1/ghostKey/settings/secrets/actions"
            exit 1
          }
          echo "::endgroup::"
          echo "::group::flyctl apps list"
          flyctl apps list || true
          echo "::endgroup::"
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --verbose
