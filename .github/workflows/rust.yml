# Continuous integration for the Rust workspace.
#
# Runs on every push to main and every PR. Goals:
#   - catch broken builds before they land,
#   - keep formatting + lint clean across contributors,
#   - keep the unit test suite green at all times.
#
# We deliberately do NOT run the regtest end-to-end test here.
# That test spawns its own bitcoind process and takes ~5 s; we
# keep it gated behind `--ignored` so contributors without a local
# bitcoind can still iterate quickly. CI without bitcoind would
# either have to skip it (false sense of security) or install
# bitcoind on every run (slow). For now, regtest e2e is a manual
# pre-release check; see DEPLOY.md.

name: rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily 04:17 UTC re-scan so a freshly-disclosed CVE in a transitive
  # dep can't sit unnoticed until the next push. The audit job is the
  # only consumer of this trigger — the build/test jobs only run on
  # actual code changes.
  schedule:
    - cron: "17 4 * * *"

# Cancel older in-flight runs for the same ref so a force-push doesn't
# pile up queue depth.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # We accept the two pre-existing type_complexity warnings on
      # the query_as tuples in routes.rs / psbt_routes.rs. New
      # warnings should fail the build.
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::type_complexity

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # The audit job uses rustsec/audit-check, which posts findings as a
    # GitHub Check annotation on the PR / commit. We need `checks: write`
    # so it can attach those annotations; `contents: read` is the bare
    # minimum to clone the repo.
    permissions:
      contents: read
      checks: write
    # `continue-on-error: true` keeps the audit job from blocking a PR
    # merge on a finding we haven't yet decided how to handle. The job
    # still surfaces a red X on the commit so it can't be missed; it
    # just doesn't gate the merge button. Tighten to `false` once the
    # audit findings have stabilised in our ignore list.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # The action's `ignore` input is a comma-separated string. We DON'T
      # rely on .cargo/audit.toml here because this specific GitHub
      # Action doesn't read it — only the local `cargo audit` CLI does.
      # The two ignore lists are intentionally kept in sync; see
      # SECURITY.md for the per-advisory reasoning.
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: "RUSTSEC-2023-0071,RUSTSEC-2026-0098,RUSTSEC-2026-0099,RUSTSEC-2026-0104,RUSTSEC-2025-0134"
