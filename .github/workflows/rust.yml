# Continuous integration for the Rust workspace.
#
# Runs on every push to main and every PR. Goals:
#   - catch broken builds before they land,
#   - keep formatting + lint clean across contributors,
#   - keep the unit test suite green at all times.
#
# We deliberately do NOT run the regtest end-to-end test here.
# That test spawns its own bitcoind process and takes ~5 s; we
# keep it gated behind `--ignored` so contributors without a local
# bitcoind can still iterate quickly. CI without bitcoind would
# either have to skip it (false sense of security) or install
# bitcoind on every run (slow). For now, regtest e2e is a manual
# pre-release check; see DEPLOY.md.

name: rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily 04:17 UTC re-scan so a freshly-disclosed CVE in a transitive
  # dep can't sit unnoticed until the next push. The audit job is the
  # only consumer of this trigger — the build/test jobs only run on
  # actual code changes.
  schedule:
    - cron: "17 4 * * *"

# Cancel older in-flight runs for the same ref so a force-push doesn't
# pile up queue depth.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # We accept the two pre-existing type_complexity warnings on
      # the query_as tuples in routes.rs / psbt_routes.rs. New
      # warnings should fail the build.
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::type_complexity

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Findings shouldn't block PRs while the ignore list is calibrating;
    # the job still surfaces a red X on the commit. Tighten to `false`
    # once we're confident the ignore list is stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # We deliberately do NOT use dtolnay/rust-toolchain here, even
      # though the build/test/clippy/fmt jobs do. Two reasons:
      #   (a) The GitHub-hosted ubuntu-latest runner ships with a recent
      #       stable Rust + cargo pre-installed, which is plenty for
      #       running cargo-audit (audit doesn't compile our crates).
      #   (b) `dtolnay/rust-toolchain` pulls from codeload.github.com,
      #       which has had multiple outages serving its tarball during
      #       the past 48 hours. The audit job is the easiest one to
      #       harden against that infrastructure, so it stays online
      #       even when the rest of the workflow can't bootstrap.
      #
      # We cache ~/.cargo/bin so the cargo-audit install is a no-op on
      # warm runs. actions/cache is first-party and uses GitHub's
      # internal cache service (not codeload), so it doesn't share the
      # same failure mode.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-${{ runner.os }}
      - run: which cargo-audit || cargo install --locked cargo-audit
      - run: cargo audit
