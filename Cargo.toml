[workspace]
resolver = "2"
members = [
    "crates/ghostkey-core",
    "crates/ghostkey-cli",
    "crates/ghostkey-server",
    "crates/ghostkey-wasm",
]
# Both sidecars are deliberately excluded from the workspace.
#
# `ghostkey-lightning-breez` is excluded because its transitive
# `breez-sdk-liquid` dependency pins `reqwest =0.12.18` exactly,
# which conflicts with every other crate in this workspace.
#
# `ghostkey-lightning-lnbits` is excluded for the same hygiene reason
# — keep sidecar HTTP-client deps out of the main workspace's lock
# file — and to mirror the breez sidecar's build shape exactly.
#
# Building each works via `cargo build` from inside its own directory,
# where it gets its own Cargo.lock and its own dep universe. See each
# crate's README and DESIGN.md § "Lightning check-ins" for the
# rationale.
exclude = [
    "crates/ghostkey-lightning-breez",
    "crates/ghostkey-lightning-lnbits",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anomalyco/ghostKey"
rust-version = "1.85"

[workspace.dependencies]
# Bitcoin stack
bdk_wallet = { version = "1.0.0", features = ["keys-bip39"] }
bdk_esplora = { version = "0.22", default-features = false, features = ["std", "blocking-https-rustls", "async-https-rustls"] }
bdk_bitcoind_rpc = "0.18"
bitcoin = { version = "0.32", features = ["rand-std", "serde"] }
miniscript = { version = "12", features = ["serde"] }

# Async + server
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros", "migrate"] }

# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Crypto (server-side encryption-at-rest for heir contacts + claim tokens)
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
hkdf  = "0.12"
sha2  = "0.10"
base64 = "0.22"
subtle = "2"
bech32 = "0.11"
bip39  = "2"

# SMTP for the notification fan-out. rustls + tokio so we don't pull
# in OpenSSL, and the "builder" feature gives the `Message::builder()`
# helpers used in `crate::notifier`. async-std support is off.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
